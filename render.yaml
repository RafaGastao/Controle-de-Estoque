services:
  - type: web
    name: casa-de-madeira-estoque
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: casa-de-madeira-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: casa-de-madeira-db
    databaseName: casa_madeira
    user: casa_madeira
    ipAllowList: []
